name: Build Android App

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sodo-dumaki-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Also published as a Release asset (not just a workflow artifact) so it has
      # a stable, directly-downloadable URL instead of an expiring Actions-artifact link.
      - name: Publish debug APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-latest
          name: "Android Debug Build (latest)"
          body: |
            Automatically built from the latest push to `android-app/`.
            Debug build for sideloading/testing only — not signed for the Play Store.
            Commit: ${{ github.sha }}
          prerelease: true
          files: android-app/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
