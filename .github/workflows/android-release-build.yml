name: Build Signed Android Release (AAB)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode release keystore
        working-directory: android-app/android
        env:
          SODO_RELEASE_KEYSTORE_BASE64: ${{ secrets.SODO_RELEASE_KEYSTORE_BASE64 }}
          SODO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SODO_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$SODO_RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d --ignore-garbage > release.keystore
          echo "Decoded keystore size: $(stat -c%s release.keystore) bytes"
          if ! keytool -list -keystore release.keystore -storepass "$SODO_RELEASE_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::release.keystore is not a valid keystore for the given SODO_RELEASE_KEYSTORE_PASSWORD. Re-check the SODO_RELEASE_KEYSTORE_BASE64 and SODO_RELEASE_KEYSTORE_PASSWORD secrets."
            exit 1
          fi
          echo "Keystore decoded and verified OK."

      - name: Build signed release AAB
        working-directory: android-app/android
        env:
          SODO_RELEASE_KEYSTORE_PATH: release.keystore
          SODO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SODO_RELEASE_KEYSTORE_PASSWORD }}
          SODO_RELEASE_KEY_ALIAS: ${{ secrets.SODO_RELEASE_KEY_ALIAS }}
          SODO_RELEASE_KEY_PASSWORD: ${{ secrets.SODO_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Remove decoded keystore
        if: always()
        working-directory: android-app/android
        run: rm -f release.keystore

      - name: Upload signed AAB (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sodo-dumaki-release-aab
          path: android-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish signed AAB as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release-latest
          name: "Android Signed Release (latest)"
          body: |
            Signed release bundle (.aab) for Google Play Console upload.
            Built from commit: ${{ github.sha }}
          prerelease: true
          files: android-app/android/app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
