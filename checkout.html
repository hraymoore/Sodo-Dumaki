<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — Sodo Dumaki</title>
<link rel="icon" href="assets/logo-icon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="site-header"></div>

<div class="page-hero">
  <div class="container">
    <span class="eyebrow">Step 2 of 2</span>
    <h1 id="checkoutHeading">Checkout</h1>
  </div>
</div>

<section class="section" id="checkoutSection">
  <div class="container grid-2" style="align-items:start;">
    <div class="form-card" style="max-width:none;">
      <div class="form-alert show" id="acctNotice" style="background:var(--sd-grey-100);color:var(--sd-grey-700);border:1px solid var(--sd-grey-100);"></div>
      <form id="checkoutForm">
        <div class="field">
          <label for="ckEmail">Email</label>
          <input type="email" id="ckEmail" required />
        </div>
        <div class="grid-2" style="gap:16px;">
          <div class="field"><label for="ckFirst">First Name</label><input type="text" id="ckFirst" required /></div>
          <div class="field"><label for="ckLast">Last Name</label><input type="text" id="ckLast" required /></div>
        </div>
        <div class="field"><label for="ckAddress">Shipping Address</label><input type="text" id="ckAddress" required /></div>
        <div class="grid-3-addr">
          <div class="field"><label for="ckCity">City</label><input type="text" id="ckCity" required /></div>
          <div class="field"><label for="ckState">State</label><div id="ckStateMount"></div></div>
          <div class="field"><label for="ckZip">ZIP Code</label><input type="text" id="ckZip" required /></div>
        </div>
        <button type="submit" class="btn btn-gold btn-block" id="ckSubmit">Continue to Payment</button>
        <p class="form-note">Pay securely via Square. Looking for layaway on a large team or organization order? That's handled through <a href="business.html" style="color:var(--sd-purple);font-weight:600;">Business &amp; Bulk Orders</a>.</p>
      </form>
    </div>

    <div class="summary-card" id="orderSummary"></div>
  </div>
</section>

<section class="section" id="confirmSection" style="display:none;">
  <div class="container" style="text-align:center;max-width:640px;">
    <span class="eyebrow" id="confirmEyebrow">Almost There</span>
    <h2 id="confirmHeading">Complete Your Payment</h2>
    <p id="confirmBody" style="max-width:520px;margin:0 auto 24px;"></p>
    <div id="confirmActions" style="display:flex;flex-direction:column;gap:12px;align-items:stretch;"></div>
    <a href="products.html" class="btn btn-outline-light" style="margin-top:24px;">Continue Shopping</a>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/products-data.js"></script>
<script src="js/main.js"></script>
<script src="js/commerce.js"></script>
<script>
  sdRenderHeader("checkout.html");
  sdRenderFooter();

  document.getElementById("ckStateMount").innerHTML = sdStateSelectHtml("ckState");

  const user = sdCurrentUser();
  const session = sdCurrentSession();
  const noticeEl = document.getElementById("acctNotice");
  if (user) {
    document.getElementById("ckEmail").value = user.email;
    document.getElementById("ckFirst").value = user.name.split(" ")[0] || "";
    document.getElementById("ckLast").value = user.name.split(" ").slice(1).join(" ") || "";
    noticeEl.textContent = `Checking out as ${user.name} (${user.email}).`;
  } else if (session && session.guest) {
    noticeEl.innerHTML = `Checking out as guest. <a href="login.html?next=checkout.html" style="color:var(--sd-purple);font-weight:600;">Sign in or create an account</a> to save this info for next time.`;
  } else {
    noticeEl.innerHTML = `<a href="login.html?next=checkout.html" style="color:var(--sd-purple);font-weight:600;">Sign in or create an account</a>, or continue below as a guest.`;
  }

  function colorwaySummaryLine(l) {
    if (!l.baseColor) return "";
    const base = sdGarmentColor(l.baseColor).label;
    const thread = l.threadColor ? ` &middot; ${sdThreadColor(l.threadColor).label} thread` : "";
    return `<div style="font-size:.78rem;color:var(--text-muted);">${base}${thread}</div>`;
  }

  function renderSummary() {
    const lines = sdCartLinesWithProducts();
    const subtotal = sdCartSubtotal();
    const shipping = subtotal >= 100 || subtotal === 0 ? 0 : 8;
    const total = subtotal + shipping;

    const itemRows = lines.map(l => `<div class="summary-row" style="align-items:flex-start;"><span>${l.qty} &times; ${l.product.name}${colorwaySummaryLine(l)}</span><span>${sdFormatPrice(l.product.price * l.qty)}</span></div>`).join("");

    document.getElementById("orderSummary").innerHTML = `
      <h3 style="margin-bottom:16px;">Order Summary</h3>
      ${itemRows || '<p style="color:var(--text-muted);">Your cart is empty.</p>'}
      <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? "Free" : sdFormatPrice(shipping)}</span></div>
      <div class="summary-row total"><span>Total</span><span>${sdFormatPrice(total)}</span></div>
    `;
  }
  renderSummary();

  document.getElementById("checkoutForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const lines = sdCartLinesWithProducts();
    if (lines.length === 0) { sdToast("Your cart is empty"); return; }

    const email = document.getElementById("ckEmail").value.trim();
    const first = document.getElementById("ckFirst").value.trim();
    const last = document.getElementById("ckLast").value.trim();
    const address = document.getElementById("ckAddress").value.trim();
    const city = document.getElementById("ckCity").value.trim();
    const state = document.getElementById("ckState").value;
    const zip = document.getElementById("ckZip").value.trim();
    sdSubscribeNewsletter(email);

    const orderItems = lines.map(l => {
      const colorway = l.baseColor ? ` (${sdGarmentColor(l.baseColor).label}${l.threadColor ? " / " + sdThreadColor(l.threadColor).label + " thread" : ""})` : "";
      return `${l.qty} x ${l.product.name}${colorway}`;
    });
    const colorwayLines = lines.filter(l => l.baseColor).map(l => ({ productId: l.id, baseColor: l.baseColor, threadColor: l.threadColor, qty: l.qty }));

    const subtotal = sdCartSubtotal();
    const shipping = subtotal >= 100 ? 0 : 8;
    const total = subtotal + shipping;

    document.getElementById("checkoutSection").style.display = "none";
    document.getElementById("confirmSection").style.display = "block";
    const actionsEl = document.getElementById("confirmActions");

    document.getElementById("confirmEyebrow").textContent = "Almost There";
    document.getElementById("confirmHeading").textContent = "Complete Your Payment";

    const currentUser = sdCurrentUser();
    let pointsNote = "";
    if (currentUser && !currentUser.isBusiness) {
      const earned = sdAwardPoints(email, total);
      const tier = sdGetTier(currentUser.points || 0);
      pointsNote = ` You just earned ${earned} Sodo Rewards points (${tier.name} tier) — track them under My Account.`;
    } else if (!currentUser) {
      pointsNote = ` Sign in next time to start earning Sodo Rewards points on every order.`;
    }
    document.getElementById("confirmBody").textContent =
      `Thanks, ${first || "there"} — pay for each item below through our secure Square checkout. Every item opens in a new tab; once all payments are complete, you're all set. A copy of your order has been noted for ${email}.${pointsNote}`;

    actionsEl.innerHTML = lines.map(l => {
      const lineTotal = sdFormatPrice(l.product.price * l.qty);
      return l.product.squareLink
        ? `<a class="btn btn-gold" href="${l.product.squareLink}" target="_blank" rel="noopener">Pay ${lineTotal} for ${l.qty} &times; ${l.product.name} — Square</a>`
        : `<button class="btn btn-gold" disabled title="Square payment link not connected yet">Pay ${lineTotal} for ${l.qty} &times; ${l.product.name} — Coming Soon</button>`;
    }).join("");

    sdRecordOrder({ type: "retail", email, state, city, zip, total, items: orderItems, meta: { paymentType: "full", colorwayLines } });

    sdSaveCart([]);
  });
</script>
</body>
</html>
