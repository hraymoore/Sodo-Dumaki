<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop All Products — Sodo Dumaki</title>
<meta name="description" content="Shop the full Sodo Dumaki collection: tops, bottoms, outerwear, headwear, bags and accessories." />
<link rel="icon" href="assets/logo-icon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="site-header"></div>

<div class="page-hero">
  <div class="container">
    <span class="eyebrow">The Full Collection</span>
    <h1>Shop Sodo Dumaki</h1>
    <p>Performance fabrics, designer detailing. Every signature design is yours to customize — pick a base color and a thread color, and make it a one-of-a-kind colorway.</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="filter-tabs" id="filterTabs"></div>
    <div class="type-filter-row">
      <label for="typeFilter">Type</label>
      <select id="typeFilter"></select>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/products-data.js"></script>
<script src="js/main.js"></script>
<script src="js/commerce.js"></script>
<script>
  sdRenderHeader("products.html");
  sdRenderFooter();

  const tabsEl = document.getElementById("filterTabs");
  const typeSelect = document.getElementById("typeFilter");
  const gridEl = document.getElementById("productGrid");
  let activeCategory = "all";

  function typesForCategory(category) {
    const pool = category === "all" ? SD_PRODUCTS : SD_PRODUCTS.filter(p => p.category === category);
    return Array.from(new Set(pool.map(p => p.type).filter(Boolean))).sort();
  }

  function renderTypeOptions(category) {
    const types = typesForCategory(category);
    typeSelect.innerHTML = `<option value="all">All Types</option>` + types.map(t => `<option value="${t}">${t}</option>`).join("");
    typeSelect.value = "all";
  }

  function renderProducts() {
    const category = activeCategory;
    const type = typeSelect.value;
    let items = category === "all" ? SD_PRODUCTS : SD_PRODUCTS.filter(p => p.category === category);
    if (type && type !== "all") items = items.filter(p => p.type === type);
    gridEl.innerHTML = items.map(sdProductCardHtml).join("");
    sdBindProductCardInteractions(gridEl);
  }

  function setActiveTab(category) {
    activeCategory = category;
    tabsEl.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.cat === category));
    renderTypeOptions(category);
  }

  tabsEl.innerHTML = SD_CATEGORIES.map(c => `<button data-cat="${c.id}">${c.label}</button>`).join("");
  tabsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    setActiveTab(btn.dataset.cat);
    renderProducts();
    history.replaceState(null, "", btn.dataset.cat === "all" ? "products.html" : `products.html#${btn.dataset.cat}`);
  });
  typeSelect.addEventListener("change", renderProducts);

  const initialCat = SD_CATEGORIES.some(c => c.id === location.hash.replace("#","")) ? location.hash.replace("#","") : "all";
  setActiveTab(initialCat);
  renderProducts();
</script>
</body>
</html>
